name: Cronus Ultimate RDP

on:
  workflow_dispatch:
    inputs:
      rdp_user:
        description: 'Username untuk RDP (default: cronus)'
        required: true
        default: 'cronus'
      password:
        description: 'RDP Password (min 8 chars)'
        required: true
        default: 'CronusZeus2024!'
      install_extras:
        description: 'Install extra tools? (yes/no)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_novnc:
        description: 'Enable VNC access? (yes/no)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  cronus-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ═══════════════════════════════════════════
      # STEP 1 — INSTALL TAILSCALE
      # ═══════════════════════════════════════════
      - name: "[1/9] Install Tailscale"
        shell: pwsh
        run: |
          Write-Host "Installing Tailscale..." -ForegroundColor Cyan
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ts.exe"
          Start-Process -FilePath "$env:TEMP\ts.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 12
          Write-Host "Tailscale installed" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 2 — CONNECT TAILSCALE
      # ═══════════════════════════════════════════
      - name: "[2/9] Connect Tailscale"
        shell: pwsh
        run: |
          Write-Host "Connecting to tailnet..." -ForegroundColor Cyan
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
                  --hostname=cronus-rdp-${{ github.run_id }} `
                  --accept-routes `
                  --accept-dns
          
          Start-Sleep -Seconds 25
          
          $ip = (& $ts ip -4 2>$null)
          if ($ip) { $ip = $ip.Trim() }
          
          if (-not $ip) {
            Write-Host "GAGAL dapat IP Tailscale. Status:" -ForegroundColor Red
            & $ts status
            exit 1
          }
          
          $dns = (& $ts status --json | ConvertFrom-Json).Self.DNSName -replace '\.$',''
          echo "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "TS_DNS=$dns" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Connected. IP: $ip | DNS: $dns" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 3 — ENABLE RDP + FIREWALL
      # ═══════════════════════════════════════════
      - name: "[3/9] Enable RDP + Firewall"
        shell: pwsh
        run: |
          Write-Host "Enabling RDP..." -ForegroundColor Cyan
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (!(Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
          Set-ItemProperty -Path $path -Name "UserAuthentication" -Value 0
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name "RDP-*" -ErrorAction SilentlyContinue
          New-NetFirewallRule -Name "RDP-TCP" -DisplayName "RDP TCP 3389" -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -Direction Inbound
          New-NetFirewallRule -Name "RDP-UDP" -DisplayName "RDP UDP 3389" -Protocol UDP -LocalPort 3389 -Action Allow -Profile Any -Direction Inbound
          
          Restart-Service TermService -Force
          Start-Sleep -Seconds 5
          Write-Host "RDP enabled" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 4 — CONFIGURE CUSTOM USER & PASSWORD (FULL FIX)
      # ═══════════════════════════════════════════
      - name: "[4/9] Configure Custom User & Password"
        shell: pwsh
        run: |
          Write-Host "Setting up custom user..." -ForegroundColor Cyan
          
          $username = "${{ github.event.inputs.rdp_user }}"
          $rawpass  = "${{ github.event.inputs.password }}"
          
          # Validasi
          if ($username.Length -lt 3) {
            Write-Host "Username minimal 3 karakter!" -ForegroundColor Red
            exit 1
          }
          if ($rawpass.Length -lt 8) {
            Write-Host "Password minimal 8 karakter!" -ForegroundColor Red
            exit 1
          }
          
          $securePass = ConvertTo-SecureString $rawpass -AsPlainText -Force
          
          # ─── Buat user baru (atau update kalau sudah ada) ───
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          
          if ($existing) {
            Write-Host "  User '$username' sudah ada. Update password..." -ForegroundColor Yellow
            Set-LocalUser -Name $username -Password $securePass
            Set-LocalUser -Name $username -PasswordNeverExpires $true
            Enable-LocalUser -Name $username
          } else {
            Write-Host "  Membuat user baru: $username" -ForegroundColor Yellow
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -Description "Cronus RDP User" `
              -ErrorAction Stop
            Write-Host "  User dibuat." -ForegroundColor Green
          }
          
          # ─── Tambah ke group ───
          $groups = @("Administrators", "Remote Desktop Users")
          foreach ($grp in $groups) {
            try {
              $members = Get-LocalGroupMember -Group $grp -ErrorAction Stop | Select-Object -ExpandProperty Name
              $found = $members | Where-Object { $_ -match "\\$username$" -or $_ -eq $username }
              if ($found) {
                Write-Host "  '$username' sudah ada di '$grp' (skip)" -ForegroundColor DarkGray
              } else {
                Add-LocalGroupMember -Group $grp -Member $username -ErrorAction Stop
                Write-Host "  '$username' ditambahkan ke '$grp'" -ForegroundColor Green
              }
            } catch {
              Write-Host "  Gagal tambah ke '$grp': $($_.Exception.Message)" -ForegroundColor Red
            }
          }
          
          # ─── Aktifkan akun bawaan 'runneradmin' juga (backup) ───
          try {
            Set-LocalUser -Name "runneradmin" -Password $securePass -ErrorAction Stop
            Write-Host "  'runneradmin' password juga di-set (backup)" -ForegroundColor DarkGray
          } catch {
            Write-Host "  'runneradmin' skip: $($_.Exception.Message)" -ForegroundColor DarkGray
          }
          
          # ─── Timezone WIB ───
          tzutil /s "SE Asia Standard Time"
          
          # ─── Verifikasi ───
          Write-Host ""
          Write-Host "=== Verifikasi User ===" -ForegroundColor Cyan
          $u = Get-LocalUser -Name $username
          Write-Host "  Name           : $($u.Name)"
          Write-Host "  Enabled        : $($u.Enabled)"
          Write-Host "  PasswordExpires: $($u.PasswordExpires)"
          Write-Host "  PasswordSet    : $($u.PasswordLastSet)"
          Write-Host ""
          Write-Host "User '$username' siap dipakai untuk RDP." -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 5 — INSTALL EXTRAS (OPSIONAL)
      # ═══════════════════════════════════════════
      - name: "[5/9] Install Extra Tools"
        if: ${{ github.event.inputs.install_extras == 'yes' }}
        shell: pwsh
        run: |
          Write-Host "Installing extras (this takes 10+ min)..." -ForegroundColor Cyan
          
          $packages = @(
            "Google.Chrome",
            "Microsoft.VisualStudioCode",
            "7zip.7zip",
            "Git.Git",
            "Python.Python.3.12",
            "OpenJS.NodeJS.LTS",
            "Notepad++.Notepad++",
            "Mozilla.Firefox"
          )
          
          foreach ($pkg in $packages) {
            Write-Host "  Installing $pkg..." -ForegroundColor Yellow
            winget install --id $pkg --silent --accept-package-agreements --accept-source-agreements 2>&1 | Out-Null
          }
          
          Write-Host "Extras installed" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 6 — SETUP VNC (OPSIONAL)
      # ═══════════════════════════════════════════
      - name: "[6/9] Setup VNC"
        if: ${{ github.event.inputs.enable_novnc == 'yes' }}
        shell: pwsh
        run: |
          Write-Host "Setting up TightVNC..." -ForegroundColor Cyan
          
          $vncUrl = "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $vncUrl -OutFile "$env:TEMP\vnc.msi"
          
          $vncPass = "${{ github.event.inputs.password }}"
          if ($vncPass.Length -gt 8) { $vncPass = $vncPass.Substring(0,8) }
          
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\vnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$vncPass SET_VIEWONLYPASSWORD=0 VALUE_OF_VIEWONLYPASSWORD=0" -Wait
          
          Start-Sleep -Seconds 15
          
          New-NetFirewallRule -Name "VNC-5900" -DisplayName "VNC 5900" -Protocol TCP -LocalPort 5900 -Action Allow -Profile Any -ErrorAction SilentlyContinue
          
          Write-Host "VNC enabled on port 5900" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 7 — HEALTH CHECK
      # ═══════════════════════════════════════════
      - name: "[7/9] Health Check"
        shell: pwsh
        run: |
          Write-Host "`n=== HEALTH CHECK ===" -ForegroundColor Magenta
          
          Write-Host "`n[+] RDP Port 3389:" -ForegroundColor Cyan
          netstat -an | Select-String ":3389" | Select-Object -First 5
          
          Write-Host "`n[+] TermService:" -ForegroundColor Cyan
          Get-Service TermService | Format-Table -AutoSize
          
          if ("${{ github.event.inputs.enable_novnc }}" -eq "yes") {
            Write-Host "`n[+] VNC Port 5900:" -ForegroundColor Cyan
            netstat -an | Select-String ":5900" | Select-Object -First 3
          }
          
          Write-Host "`n[+] Tailscale Status:" -ForegroundColor Cyan
          & "C:\Program Files\Tailscale\tailscale.exe" status
          
          Write-Host "`n[+] System Info:" -ForegroundColor Cyan
          Write-Host "  OS  : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "  RAM : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,2)) GB"
          Write-Host "  CPU : $((Get-CimInstance Win32_Processor).Name)"
          Write-Host "  Core: $((Get-CimInstance Win32_Processor).NumberOfCores)"
          Write-Host ""

      # ═══════════════════════════════════════════
      # STEP 8 — SHOW CONNECTION INFO
      # ═══════════════════════════════════════════
      - name: "[8/9] Connection Info"
        shell: pwsh
        run: |
          $ip    = "${{ env.TS_IP }}"
          $dns   = "${{ env.TS_DNS }}"
          $user  = "${{ github.event.inputs.rdp_user }}"
          $pass  = "${{ github.event.inputs.password }}"
          $vnc   = "${{ github.event.inputs.enable_novnc }}"
          
          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Cyan
          Write-Host "         CRONUS ULTIMATE RDP -- READY                " -ForegroundColor Cyan
          Write-Host "======================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  [RDP ACCESS]" -ForegroundColor Yellow
          Write-Host "  --------------------------------" -ForegroundColor Yellow
          Write-Host "  Host     : $ip" -ForegroundColor White
          Write-Host "  DNS      : $dns" -ForegroundColor White
          Write-Host "  Port     : 3389" -ForegroundColor White
          Write-Host "  User     : $user" -ForegroundColor White
          Write-Host "  Password : $pass" -ForegroundColor White
          Write-Host ""
          
          if ($vnc -eq "yes") {
            Write-Host "  [VNC ACCESS]" -ForegroundColor Yellow
            Write-Host "  --------------------------------" -ForegroundColor Yellow
            Write-Host "  Host     : $ip:5900" -ForegroundColor White
            Write-Host "  Password : (8 char pertama dari password RDP)" -ForegroundColor White
            Write-Host ""
          }
          
          Write-Host "  [INFO]" -ForegroundColor Yellow
          Write-Host "  --------------------------------" -ForegroundColor Yellow
          Write-Host "  Uptime   : 6 jam" -ForegroundColor Green
          Write-Host "  Timezone : WIB (Asia/Jakarta)" -ForegroundColor Green
          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Cyan
          Write-Host ""

      # ═══════════════════════════════════════════
      # STEP 9 — KEEP ALIVE
      # ═══════════════════════════════════════════
      - name: "[9/9] Keep Alive — 6 Hours"
        shell: pwsh
        run: |
          Write-Host "RDP aktif 6 jam. Auto-terminate setelah 360 menit." -ForegroundColor Green
          
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 1800
            Write-Host "[$i/12] Heartbeat - $(Get-Date -Format 'HH:mm:ss') WIB" -ForegroundColor Cyan
            
            $rdp = netstat -an | Select-String ":3389.*LISTENING"
            if (-not $rdp) {
              Write-Host "RDP port mati! Restart..." -ForegroundColor Red
              Restart-Service TermService -Force
            }
            
            $ts = "C:\Program Files\Tailscale\tailscale.exe"
            $status = & $ts status 2>&1
            if ($status -match "offline|Logged out|NeedsLogin") {
              Write-Host "Tailscale down! Reconnect..." -ForegroundColor Red
              & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes --accept-dns
            }
          }
