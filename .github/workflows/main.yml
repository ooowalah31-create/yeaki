name: Cronus Ultimate RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password (min 8 chars)'
        required: true
        default: 'CronusZeus2024!'
      install_extras:
        description: 'Install extra tools? (yes/no)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_novnc:
        description: 'Enable web-based VNC access? (yes/no)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  cronus-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ═══════════════════════════════════════════
      # STEP 1 — TAILSCALE SETUP
      # ═══════════════════════════════════════════
      - name: "[1/10] Install Tailscale"
        shell: pwsh
        run: |
          Write-Host "⚡ Installing Tailscale..." -ForegroundColor Cyan
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ts.exe"
          Start-Process -FilePath "$env:TEMP\ts.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 12
          Write-Host "✓ Tailscale installed" -ForegroundColor Green

      - name: "[2/10] Connect Tailscale"
        shell: pwsh
        run: |
          Write-Host "⚡ Connecting to tailnet..." -ForegroundColor Cyan
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
                  --hostname=cronus-rdp-${{ github.run_id }} `
                  --accept-routes `
                  --accept-dns `
                  --ssh
          Start-Sleep -Seconds 25
          $ip = (& $ts ip -4).Trim()
          $dns = (& $ts status --json | ConvertFrom-Json).Self.DNSName -replace '\.$',''
          echo "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "TS_DNS=$dns" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✓ Connected. IP: $ip | DNS: $dns" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 3 — ENABLE RDP (MAXIMUM AGGRESSION)
      # ═══════════════════════════════════════════
      - name: "[3/10] Enable RDP + Firewall"
        shell: pwsh
        run: |
          Write-Host "⚡ Enabling RDP..." -ForegroundColor Cyan
          
          # Registry tweaks
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          
          # Disable NLA via policy
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (!(Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
          Set-ItemProperty -Path $path -Name "UserAuthentication" -Value 0
          
          # Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name "RDP-*" -ErrorAction SilentlyContinue
          New-NetFirewallRule -Name "RDP-TCP" -DisplayName "RDP TCP 3389" -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -Direction Inbound
          New-NetFirewallRule -Name "RDP-UDP" -DisplayName "RDP UDP 3389" -Protocol UDP -LocalPort 3389 -Action Allow -Profile Any -Direction Inbound
          
          # Restart
          Restart-Service TermService -Force
          Start-Sleep -Seconds 5
          Write-Host "✓ RDP enabled" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 4 — SET PASSWORD & USER
      # ═══════════════════════════════════════════
      - name: "[4/10] Configure User & Password"
        shell: pwsh
        run: |
          Write-Host "⚡ Setting up user..." -ForegroundColor Cyan
          $pass = ConvertTo-SecureString "${{ github.event.inputs.password }}" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass
          net user runneradmin /active:yes
          net user runneradmin /passwordchg:no
          net localgroup Administrators runneradmin /add 2>$null
          net localgroup "Remote Desktop Users" runneradmin /add 2>$null
          wmic useraccount where "name='runneradmin'" set PasswordExpires=false
          
          # Set timezone ke WIB
          tzutil /s "SE Asia Standard Time"
          
          Write-Host "✓ User configured" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 5 — INSTALL EXTRAS (OPTIONAL)
      # ═══════════════════════════════════════════
      - name: "[5/10] Install Extra Tools"
        if: ${{ github.event.inputs.install_extras == 'yes' }}
        shell: pwsh
        run: |
          Write-Host "⚡ Installing extras (this takes a while)..." -ForegroundColor Cyan
          
          # Winget packages
          $packages = @(
            "Google.Chrome",
            "Microsoft.VisualStudioCode",
            "7zip.7zip",
            "Git.Git",
            "Python.Python.3.12",
            "OpenJS.NodeJS.LTS",
            "Notepad++.Notepad++",
            "Mozilla.Firefox",
            "Discord.Discord",
            "Valve.Steam"
          )
          
          foreach ($pkg in $packages) {
            Write-Host "  → Installing $pkg..." -ForegroundColor Yellow
            winget install --id $pkg --silent --accept-package-agreements --accept-source-agreements 2>&1 | Out-Null
          }
          
          Write-Host "✓ Extras installed" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 6 — ENABLE noVNC (WEB ACCESS)
      # ═══════════════════════════════════════════
      - name: "[6/10] Setup noVNC Web Access"
        if: ${{ github.event.inputs.enable_novnc == 'yes' }}
        shell: pwsh
        run: |
          Write-Host "⚡ Setting up noVNC..." -ForegroundColor Cyan
          
          # Download TightVNC + noVNC
          $vncUrl = "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $vncUrl -OutFile "$env:TEMP\vnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\vnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ github.event.inputs.password }} SET_VIEWONLYPASSWORD=0 VALUE_OF_VIEWONLYPASSWORD=0" -Wait
          
          Start-Sleep -Seconds 15
          
          # Configure VNC port
          $vncPath = "C:\Program Files\TightVNC"
          & "$vncPath\tvnserver.exe" -controlservice -connect
          Start-Sleep -Seconds 5
          
          # Firewall for VNC
          New-NetFirewallRule -Name "VNC-5900" -DisplayName "VNC 5900" -Protocol TCP -LocalPort 5900 -Action Allow -Profile Any -ErrorAction SilentlyContinue
          
          Write-Host "✓ VNC enabled on port 5900" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 7 — VERIFY EVERYTHING
      # ═══════════════════════════════════════════
      - name: "[7/10] Health Check"
        shell: pwsh
        run: |
          Write-Host "`n═══════════ HEALTH CHECK ═══════════" -ForegroundColor Magenta
          
          Write-Host "`n[+] RDP Port:" -ForegroundColor Cyan
          netstat -an | Select-String ":3389" | Select-Object -First 5
          
          Write-Host "`n[+] TermService:" -ForegroundColor Cyan
          Get-Service TermService | Format-Table -AutoSize
          
          if ("${{ github.event.inputs.enable_novnc }}" -eq "yes") {
            Write-Host "`n[+] VNC Port:" -ForegroundColor Cyan
            netstat -an | Select-String ":5900" | Select-Object -First 3
          }
          
          Write-Host "`n[+] Tailscale Status:" -ForegroundColor Cyan
          & "C:\Program Files\Tailscale\tailscale.exe" status
          
          Write-Host "`n[+] System Info:" -ForegroundColor Cyan
          Write-Host "  OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "  RAM: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,2)) GB"
          Write-Host "  CPU: $((Get-CimInstance Win32_Processor).Name)"
          Write-Host "  CPU Cores: $((Get-CimInstance Win32_Processor).NumberOfCores)"
          
          Write-Host "`n════════════════════════════════════" -ForegroundColor Magenta

      # ═══════════════════════════════════════════
      # STEP 8 — SHOW CONNECTION INFO
      # ═══════════════════════════════════════════
      - name: "[8/10] Connection Info"
        shell: pwsh
        run: |
          $ip = "${{ env.TS_IP }}"
          $dns = "${{ env.TS_DNS }}"
          $pass = "${{ github.event.inputs.password }}"
          $novnc = "${{ github.event.inputs.enable_novnc }}"
          
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         🏛️  CRONUS ULTIMATE RDP — READY  🏛️          ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║                                                      ║" -ForegroundColor Cyan
          Write-Host "║  📡 RDP ACCESS                                       ║" -ForegroundColor Yellow
          Write-Host "║  ────────────────────────────────────                ║" -ForegroundColor Yellow
          Write-Host "║  Host     : $ip                          ║" -ForegroundColor White
          Write-Host "║  DNS      : $dns" -ForegroundColor White
          Write-Host "║  Port     : 3389                                     ║" -ForegroundColor White
          Write-Host "║  User     : runneradmin                              ║" -ForegroundColor White
          Write-Host "║  Password : $pass" -ForegroundColor White
          Write-Host "║                                                      ║" -ForegroundColor Cyan
          
          if ($novnc -eq "yes") {
            Write-Host "║  🌐 VNC ACCESS (via browser/Tailscale)              ║" -ForegroundColor Yellow
            Write-Host "║  ────────────────────────────────────                ║" -ForegroundColor Yellow
            Write-Host "║  Host     : $ip:5900                     ║" -ForegroundColor White
            Write-Host "║  Password : $pass" -ForegroundColor White
            Write-Host "║                                                      ║" -ForegroundColor Cyan
          }
          
          Write-Host "║  🔐 SSH (via Tailscale SSH)                          ║" -ForegroundColor Yellow
          Write-Host "║  ────────────────────────────────────                ║" -ForegroundColor Yellow
          Write-Host "║  ssh runneradmin@$ip" -ForegroundColor White
          Write-Host "║                                                      ║" -ForegroundColor Cyan
          Write-Host "║  ⏱️  Uptime: 6 jam                                   ║" -ForegroundColor Green
          Write-Host "║  📅 Timezone: WIB (Asia/Jakarta)                     ║" -ForegroundColor Green
          Write-Host "║                                                      ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

      # ═══════════════════════════════════════════
      # STEP 9 — WATCHDOG (AUTO-RECONNECT)
      # ═══════════════════════════════════════════
      - name: "[9/10] Start Watchdog"
        shell: pwsh
        run: |
          # Background job: cek Tailscale + RDP tiap 5 menit
          $job = Start-Job -ScriptBlock {
            $ts = "C:\Program Files\Tailscale\tailscale.exe"
            while ($true) {
              Start-Sleep -Seconds 300
              
              # Cek Tailscale
              $status = & $ts status 2>&1
              if ($status -match "offline|stopped|Logged out") {
                Write-Host "[$(Get-Date)] Tailscale down, reconnecting..."
                & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes --ssh
              }
              
              # Cek RDP service
              $svc = Get-Service TermService
              if ($svc.Status -ne "Running") {
                Write-Host "[$(Get-Date)] RDP down, restarting..."
                Restart-Service TermService -Force
              }
            }
          }
          Write-Host "✓ Watchdog started (Job ID: $($job.Id))" -ForegroundColor Green

      # ═══════════════════════════════════════════
      # STEP 10 — KEEP ALIVE
      # ═══════════════════════════════════════════
      - name: "[10/10] Keep Alive — 6 Hours"
        shell: pwsh
        run: |
          Write-Host "🕐 RDP aktif selama 6 jam." -ForegroundColor Green
          Write-Host "🕐 Akan auto-terminate setelah 360 menit." -ForegroundColor Green
          Write-Host ""
          
          # Heartbeat tiap 30 menit
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 1800
            Write-Host "[$i/12] Heartbeat — $(Get-Date -Format 'HH:mm:ss') WIB" -ForegroundColor Cyan
            
            # Re-verify RDP port
            $rdp = netstat -an | Select-String ":3389.*LISTENING"
            if (-not $rdp) {
              Write-Host "⚠️ RDP port mati! Restart..." -ForegroundColor Red
              Restart-Service TermService -Force
            }
            
            # Tailscale ping
            $tsIP = "${{ env.TS_IP }}"
            $ping = Test-Connection -ComputerName $tsIP -Count 1 -Quiet -ErrorAction SilentlyContinue
            if (-not $ping) {
              Write-Host "⚠️ Tailscale down! Reconnect..." -ForegroundColor Red
              & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes --ssh
            }
          }
